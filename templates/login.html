<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>تسجيل الدخول</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="auth-wrap">
    <section class="glass auth-card">
        <div class="auth-logo">{{ icon('graduation-cap', 52) }}</div>
        <h1>تسجيل الدخول</h1>
        <p class="sub">أهلًا بيك تاني، كمّل مذاكرتك من مكانك.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST">
            <div class="field">
                <label for="username">اسم المستخدم</label>
                <input type="text" name="username" id="username" autocomplete="username" autofocus required>
            </div>

            <div class="field">
                <label for="password">كلمة المرور</label>
                <input type="password" name="password" id="password" autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block">{{ icon('log-in', 18) }} دخول</button>
        </form>

        <p class="auth-switch">معندكش حساب؟ <a href="{{ url_for('register') }}">سجّل دلوقتي</a></p>
    </section>
</main>
</body>
</html>
